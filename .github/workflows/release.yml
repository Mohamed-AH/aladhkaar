# Builds aladhkaar-update.zip (the layout deploy.sh expects) and attaches it to a GitHub release.
# Run it by pushing a tag such as v18, or from the Actions tab ("Run workflow").
# Latest zip: https://github.com/Mohamed-AH/aladhkaar/releases/latest/download/aladhkaar-update.zip
name: Release update zip

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v18"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          mkdir -p build/aladhkaar
          git archive HEAD | tar -x -C build/aladhkaar
          rm -rf build/aladhkaar/.github build/aladhkaar/README.md
          cd build && zip -qr ../aladhkaar-update.zip aladhkaar

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" aladhkaar-update.zip \
            --target "$GITHUB_SHA" \
            --title "aladhkaar.com $TAG" \
            --notes "Download aladhkaar-update.zip to your Downloads folder, then run deploy-adhkar (or bash /d/aladhkaar/deploy.sh)."
