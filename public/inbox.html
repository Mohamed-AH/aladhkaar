<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Inbox · Adhkar Maker</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root { --bg:#f6f4ef; --surface:#fff; --ink:#1d2321; --ink-2:#56605c; --ink-3:#8a928e; --line:#e3dfd6; --accent:#1f6b55; --soft:#e3efe9; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --bg:#16171a; --surface:#1f2124; --ink:#ecebe7; --ink-2:#b4b6b2; --ink-3:#80847f; --line:#30333a; --accent:#6cc3a3; --soft:#213a31; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "IBM Plex Sans Arabic", system-ui, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }
h1 { font-size: 20px; margin: 0 0 16px; display: flex; align-items: center; gap: 10px; }
h1 small { font-weight: 400; color: var(--ink-3); font-size: 14px; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
button, input { font: inherit; }
.tab, .btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:hover { border-color: var(--ink-3); }
.spacer { flex: 1; }
.login { display: flex; gap: 8px; max-width: 420px; }
.login input { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.msg { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
.msg-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--ink-3); }
.pill { background: var(--soft); color: var(--accent); border-radius: 999px; padding: 1px 10px; font-weight: 600; font-size: 12px; }
.msg-body { white-space: pre-wrap; margin: 10px 0; font-size: 16px; overflow-wrap: anywhere; }
.msg-body[dir="rtl"] { font-family: "Amiri", serif; font-size: 20px; line-height: 1.8; }
.msg-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.msg-actions a { color: var(--accent); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; }
.empty, .note { color: var(--ink-3); }
</style>
</head>
<body>
<main>
  <h1>Inbox <small id="count"></small></h1>
  <form class="login" id="login" hidden>
    <input type="password" id="token" placeholder="Admin token" autocomplete="current-password">
    <button class="btn" type="submit">Open</button>
  </form>
  <div id="app" hidden>
    <div class="bar">
      <button class="tab" data-status="new" aria-pressed="true">New</button>
      <button class="tab" data-status="done">Done</button>
      <button class="tab" data-status="spam">Spam</button>
      <button class="tab" data-status="all">All</button>
      <span class="spacer"></span>
      <button class="btn" id="refresh">Refresh</button>
      <button class="btn" id="logout">Sign out</button>
    </div>
    <div id="list"></div>
  </div>
  <p class="note" id="note"></p>
</main>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const LABEL = { dhikr: "Dhikr", idea: "Idea", problem: "Problem", other: "Other" };
  let token = sessionStorage.getItem("inboxToken") || "", status = "new";
  const fmt = new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short" });
  const api = (path, opts = {}) => fetch(path, { ...opts, headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" } });

  function show(loggedIn) { $("#login").hidden = loggedIn; $("#app").hidden = !loggedIn; }

  async function load() {
    $("#note").textContent = "Loading…";
    const res = await api("/api/messages?status=" + status).catch(() => null);
    if (!res) { $("#note").textContent = "Couldn't reach the server."; return; }
    if (res.status === 429) { sessionStorage.removeItem("inboxToken"); token = ""; show(false); $("#note").textContent = "Too many wrong tokens. Try again in 15 minutes."; return; }
    if (res.status === 401) { sessionStorage.removeItem("inboxToken"); token = ""; show(false); $("#note").textContent = "That token didn't work."; return; }
    const { messages = [] } = await res.json();
    sessionStorage.setItem("inboxToken", token); show(true); $("#note").textContent = "";
    $("#count").textContent = messages.length ? `${messages.length} ${status === "all" ? "" : status}` : "";
    const list = $("#list"); list.innerHTML = "";
    if (!messages.length) { list.innerHTML = '<p class="empty">Nothing here.</p>'; return; }
    for (const m of messages) {
      const el = document.createElement("article"); el.className = "msg";
      const head = document.createElement("div"); head.className = "msg-head";
      const pill = document.createElement("span"); pill.className = "pill"; pill.textContent = LABEL[m.type] || m.type;
      const who = document.createElement("span"); who.textContent = [m.name, m.email].filter(Boolean).join(" · ") || "Anonymous";
      const meta = document.createElement("span"); meta.textContent = [fmt.format(m.created_at), m.lang && m.lang.toUpperCase(), m.country].filter(Boolean).join(" · ");
      head.append(pill, who, meta);
      const body = document.createElement("div"); body.className = "msg-body"; body.dir = /[؀-ۿ]/.test(m.message) ? "rtl" : "auto"; body.textContent = m.message;
      const actions = document.createElement("div"); actions.className = "msg-actions";
      if (m.email) {
        const a = document.createElement("a");
        a.href = `mailto:${encodeURIComponent(m.email)}?subject=${encodeURIComponent("Re: your message to Adhkar Maker")}&body=${encodeURIComponent("\n\n> " + m.message.split("\n").join("\n> "))}`;
        a.textContent = "Reply"; actions.append(a);
      }
      for (const [s, label] of [["done", "Mark done"], ["new", "Mark new"], ["spam", "Spam"]]) {
        if (s === m.status) continue;
        const b = document.createElement("button"); b.className = "btn"; b.textContent = label;
        b.onclick = async () => { b.disabled = true; await api("/api/messages", { method: "POST", body: JSON.stringify({ id: m.id, status: s }) }); load(); };
        actions.append(b);
      }
      el.append(head, body, actions); list.append(el);
    }
  }

  $("#login").addEventListener("submit", e => { e.preventDefault(); token = $("#token").value.trim(); if (token) load(); });
  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
    status = b.dataset.status; document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-pressed", String(x === b))); load();
  }));
  $("#refresh").addEventListener("click", load);
  $("#logout").addEventListener("click", () => { sessionStorage.removeItem("inboxToken"); token = ""; $("#list").innerHTML = ""; show(false); });
  token ? load() : show(false);
})();
</script>
</body>
</html>
