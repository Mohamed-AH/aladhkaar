# Cloudflare Pages project for aladhkaar.com
# Secrets (TO_EMAIL, RESEND_API_KEY, TURNSTILE_SECRET, ADMIN_TOKEN, IP_SALT) are NOT kept here.
# Set them with:  npx wrangler pages secret put NAME --project-name adhkar-maker
name = "adhkar-maker"
pages_build_output_dir = "./public"
compatibility_date = "2025-09-01"

[vars]
FROM_EMAIL = "Adhkar Maker <contact@aladhkaar.com>"

[[d1_databases]]
binding = "DB"
database_name = "aladhkaar"
database_id = "PASTE_DATABASE_ID_HERE"
